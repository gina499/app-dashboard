<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App & Tool Dashboard</title>
    <script type="module" crossorigin src="./assets/index-BZsJNk28.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Bl0E6WHI.css">
    <style>
      /* ===== Sidebar – Lokale Apps ===== */
      #app-sidebar {
        position: fixed;
        left: 0;
        top: 0;
        height: 100vh;
        width: 68px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 12px 0 10px;
        gap: 2px;
        background: rgba(248,250,252,0.5);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-right: 1px solid rgba(148,163,184,0.15);
        transition: background 0.3s, border-color 0.3s;
      }
      .dark #app-sidebar {
        background: rgba(15,23,42,0.45);
        border-right: 1px solid rgba(255,255,255,0.08);
      }

      #app-sidebar .app-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        border-radius: 14px;
        text-decoration: none;
        color: #475569;
        transition: all 0.2s ease;
        gap: 3px;
        cursor: pointer;
        border: none;
        background: transparent;
        position: relative;
      }
      #app-sidebar .app-btn:hover {
        background: rgba(99,102,241,0.1);
        color: #4f46e5;
      }
      #app-sidebar .app-btn:active {
        transform: scale(0.94);
      }
      .dark #app-sidebar .app-btn {
        color: rgba(226,232,240,0.7);
      }
      .dark #app-sidebar .app-btn:hover {
        background: rgba(129,140,248,0.15);
        color: #a5b4fc;
      }

      #app-sidebar .app-btn svg {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }
      #app-sidebar .app-btn .app-label {
        font-size: 7px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      #app-sidebar .sidebar-divider {
        width: 28px;
        height: 1px;
        background: rgba(148,163,184,0.15);
        margin: 6px 0;
      }
      .dark #app-sidebar .sidebar-divider {
        background: rgba(255,255,255,0.08);
      }

      #app-sidebar .sidebar-note {
        font-size: 6px;
        color: rgba(100,116,139,0.3);
        margin-top: auto;
        letter-spacing: 0.5px;
        font-weight: 600;
      }
      .dark #app-sidebar .sidebar-note {
        color: rgba(148,163,184,0.2);
      }

      /* Platz für die Sidebar */
      body {
        padding-left: 68px;
      }

      /* LaunchPad Pro Titel größer */
      h1.text-xl {
        font-size: 1.75rem !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="app-sidebar"></div>

    <script>
      (function() {
        var apps = [
          {
            label: 'Obsidian',
            url: 'obsidian://open',
            svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><path d="M16 8.2C16 7 15 6 13.8 6h-.4c-1.2 0-2.4.6-3 1.6l-.6 1c-.6 1-.6 2.2 0 3.2l.6 1c.6 1 1.8 1.6 3 1.6h.4c1.2 0 2.4-.6 3-1.6l.6-1c.6-1 .6-2.2 0-3.2Z"/></svg>'
          },
          {
            label: 'VS Code',
            url: 'vscode://',
            svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>'
          },
          {
            label: 'OpenCode',
            url: 'opencode://',
            svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>'
          },
          {
            label: 'Stirling',
            url: 'stirlingpdf://',
            svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>'
          }
        ];

        var sidebar = document.getElementById('app-sidebar');
        if (!sidebar) return;

        // App-Buttons (ohne Heading)
        apps.forEach(function(app) {
          var btn = document.createElement('a');
          btn.className = 'app-btn';
          btn.href = app.url;
          btn.title = app.label;
          btn.innerHTML = app.svg + '<span class="app-label">' + app.label + '</span>';
          sidebar.appendChild(btn);
        });

        // Divider
        var divider = document.createElement('div');
        divider.className = 'sidebar-divider';
        sidebar.appendChild(divider);

        // "LOKAL"-Hinweis
        var note = document.createElement('div');
        note.className = 'sidebar-note';
        note.textContent = 'LOKAL';
        sidebar.appendChild(note);
      })();

      // ===== Footer & Titel nach dem React-Rendering anpassen =====
      (function fixDashboard() {
        var applied = false;
        function apply() {
          if (applied) return;
          applied = true;
          // Footer-Text: LaunchPadPro, ohne "Offener Quellcode"
          var paras = document.querySelectorAll('footer p');
          paras.forEach(function(p) {
            if (p.textContent.includes('Launchpad') || p.textContent.includes('LaunchPad')) {
              p.textContent = '© ' + new Date().getFullYear() + ' LaunchPadPro · Made with ❤';
            }
          });

          // Rocket-Enterprise-Zeile entfernen
          var rocketEls = document.querySelectorAll('footer span');
          rocketEls.forEach(function(el) {
            if (el.textContent.includes('Enterprise Cluster') || el.textContent.includes('🚀')) {
              if (el.parentNode) el.parentNode.removeChild(el);
            }
          });

          // Trennpunkt "•" zwischen Rocket und Defaults entfernen
          var dots = document.querySelectorAll('footer span');
          dots.forEach(function(s) {
            if (s.textContent.trim() === '•' || s.textContent.trim() === '·') {
              // Nach der Rocket-Entfernung prüfen, ob der Dot allein im Container ist
              if (s.parentNode && s.parentNode.querySelectorAll('span').length <= 1) {
                // Rocket ist weg, Dot auch entfernen
                if (s.parentNode) s.parentNode.removeChild(s);
              }
            }
          });
        }

        // Warten bis React gerendert hat (max 5 Sekunden)
        var tries = 0;
        function waitAndApply() {
          tries++;
          var footerP = document.querySelector('footer p');
          if (footerP && footerP.textContent.includes('Launch') && tries < 50) {
            apply();
          } else if (tries < 50) {
            setTimeout(waitAndApply, 100);
          }
        }
        waitAndApply();
      })();
    </script>
  </body>
</html>
